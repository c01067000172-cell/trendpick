services:
  - type: web
    name: trendpick
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /
    envVars:
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: MASPICK_ADMIN_PASSWORD
        sync: false
      - key: TRENDPICK_DATA_DIR
        value: /var/data/trendpick
    disk:
      name: trendpick-data
      mountPath: /var/data/trendpick
      sizeGB: 1